name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, format check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uvx ruff@0.15.5 check .

      - name: Ruff format check
        run: uvx ruff@0.15.5 format --check .

      - name: Run tests
        run: uv run pytest
